name: Deploy Emojinq gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Emojinq
        uses: actions/checkout@v4

      - name: Build OpenMoji Black grayscale gallery
        run: |
          python3 -m pip install -r requirements-build.txt
          python3 scripts/fetch_openmoji.py
          python3 scripts/build_all.py --source-dir .cache/openmoji/black/svg --mode grayscale
          python3 scripts/fetch_yuji_boku.py
          python3 scripts/build_alpha_svg.py
          python3 scripts/build_font.py --source-dir assets/gray-all --manifest assets/gray-all/manifest.json --alpha-dir assets/alpha-ink --alpha-manifest assets/alpha-ink/manifest.json --output fonts/Emojinq-Regular.ttf
          python3 scripts/check_quality.py --source-dir assets/gray-all --sample 12
          python3 scripts/check_font.py fonts/Emojinq-Regular.ttf

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/docs _site/assets _site/fonts
          cp -R docs/* _site/docs/
          cp -R assets/gray-all _site/assets/
          cp fonts/Emojinq-Regular.ttf _site/fonts/
          cp docs/all.html _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
