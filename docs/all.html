<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emojinq — full OpenMoji set</title>
  <style>
    :root { color-scheme: light; --paper:#e9e7e1; --ink:#292826; --quiet:#77746d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:16px/1.4 Georgia,serif; }
    main { max-width:1200px; margin:auto; padding:5vw; }
    h1 { margin:0; font:400 clamp(3rem,8vw,7rem)/.8 "SignPainter","Bradley Hand",cursive; }
    p { color:var(--quiet); }
    #status { font:700 .72rem/1 sans-serif; letter-spacing:.12em; text-transform:uppercase; }
    .controls { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; margin:1.5rem 0; padding:1rem; background:#f5f3ed; border:1px solid #d0cdc4; font:14px/1.2 ui-sans-serif,sans-serif; }
    label { display:flex; gap:.5rem; align-items:center; }
    select, input { accent-color:#292826; }
    .search { flex:1 1 18rem; min-width:16rem; padding:.55rem .7rem; border:1px solid #bdb9af; background:#fffefa; color:var(--ink); font:14px ui-sans-serif,sans-serif; }
    .type-sample { margin:1.5rem 0; padding:1rem 1.2rem; background:#f5f3ed; border:1px solid #d0cdc4; overflow:auto; color:#262421; font:clamp(1.4rem,3vw,2.4rem)/1.25 "Emojinq", sans-serif; white-space:nowrap; }
    .type-sample small { display:block; margin-bottom:.4rem; color:var(--quiet); font:10px/1.2 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; }
    .alpha-section { margin:1.5rem 0; }
    .alpha-section h2 { margin:0 0 .6rem; color:var(--quiet); font:700 .72rem/1 sans-serif; letter-spacing:.12em; text-transform:uppercase; }
    .alpha-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:.45rem; padding:.6rem; background:#d0cdc4; }
    .alpha-card { min-height:88px; display:grid; place-items:center; align-content:center; gap:.35rem; padding:.45rem; background:#f5f3ed; border:1px solid #d0cdc4; }
    .alpha-glyph { color:#262421; font:normal 3.6rem/.8 "Emojinq", sans-serif; }
    .alpha-card code { color:var(--quiet); font:10px/1 ui-monospace,monospace; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:.55rem; height:75vh; overflow:auto; padding:.6rem; background:#d0cdc4; }
    figure { margin:0; padding:.6rem; background:#f5f3ed; border:1px solid #d0cdc4; }
    .glyph { display:grid; width:100%; aspect-ratio:1; place-items:center; color:#262421; font:normal 5.2rem/1 "Emojinq", sans-serif; font-variant-ligatures:common-ligatures; }
    figcaption { overflow:hidden; color:var(--quiet); font:10px/1.2 ui-monospace,monospace; text-overflow:ellipsis; white-space:nowrap; }
  </style>
</head>
<body><main>
  <h1>iNQ</h1>
  <p>Emojinq · full OpenMoji Black brush-ink build</p>
  <div id="status">Loading manifest…</div>
  <div class="controls" aria-label="Gallery controls">
    <input class="search" id="search" type="search" placeholder="Search emoji, code point, or group…" aria-label="Search emoji">
    <label>Group <select id="group"><option value="all">All groups</option></select></label>
  </div>
  <div class="type-sample" aria-label="Emojinq alphabet specimen"><small>Emojinq brush alphabet</small>ABCDEFGHIJKLMNOPQRSTUVWXYZ · abcdefghijklmnopqrstuvwxyz · 0123456789</div>
  <section class="alpha-section" aria-labelledby="alpha-title">
    <h2 id="alpha-title">Alphanumerics · TTF font glyphs</h2>
    <div class="alpha-grid" id="alpha-grid"></div>
  </section>
  <section class="grid" id="grid" aria-label="Full Emojinq gallery"></section>
  <script>
    const SYNONYMS = {
      arm: ["biceps", "muscle", "strong", "flexed"],
      biceps: ["arm", "muscle", "strong", "flexed"],
      muscle: ["arm", "biceps", "strong", "flexed"],
      happy: ["smile", "smiley", "joy", "glad"],
      smile: ["happy", "smiley", "joy", "grin"],
      love: ["heart", "romance", "affection"],
      heart: ["love", "romance", "affection"],
      home: ["house", "building", "place"],
      house: ["home", "building"],
      pin: ["place", "location", "map", "marker"],
      place: ["pin", "location", "map", "marker"],
      food: ["eat", "meal", "drink", "fruit", "vegetable"],
      animal: ["beast", "creature", "wildlife"],
      nature: ["plant", "flower", "leaf", "tree"],
      travel: ["trip", "journey", "transport", "vehicle"],
      warning: ["alert", "danger", "caution"],
      yes: ["check", "approved", "correct"],
      no: ["cross", "wrong", "forbidden"]
    };
    const expandQuery = query => query.split(/\s+/).filter(Boolean).flatMap(token => [token, ...(SYNONYMS[token] || [])]);
    const ALPHANUMERICS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    const assetRoot = location.pathname.endsWith("/docs/all.html") ? "../assets/gray-all/" : "assets/gray-all/";
    const fontRoot = location.pathname.endsWith("/docs/all.html") ? "../fonts/" : "fonts/";
    const fontStyle = document.createElement("style");
    fontStyle.textContent = `@font-face { font-family: Emojinq; src: url("${fontRoot}Emojinq-Regular.ttf?v=yuji-boku-1") format("truetype"); font-display: swap; }`;
    document.head.append(fontStyle);
    const alphaGrid = document.getElementById("alpha-grid");
    for (const character of ALPHANUMERICS) {
      const card = document.createElement("div");
      card.className = "alpha-card";
      card.setAttribute("aria-label", `Letter or digit ${character}`);
      const glyph = document.createElement("span");
      glyph.className = "alpha-glyph";
      glyph.textContent = character;
      const code = document.createElement("code");
      code.textContent = `U+${character.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")}`;
      card.append(glyph, code);
      alphaGrid.append(card);
    }

    fetch(`${assetRoot}manifest.json`).then(r => {
      if (!r.ok) throw new Error(`manifest request failed (${r.status})`);
      return r.json();
    }).then(items => {
      const grid = document.getElementById("grid");
      const group = document.getElementById("group");
      const search = document.getElementById("search");
      [...new Set(items.map(item => item.group))].sort().forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        group.appendChild(option);
      });
      const render = () => {
        const selected = group.value;
        const query = expandQuery(search.value.trim().toLowerCase());
        const visible = items.filter(item => {
          const inGroup = selected === "all" || item.group === selected;
          const haystack = `${item.label || ""} ${item.name} ${item.group} ${item.codepoints.map(cp => cp.toString(16)).join(" ")}`.toLowerCase();
          return inGroup && (!query.length || query.some(term => haystack.includes(term)));
        });
        while (grid.firstChild) grid.removeChild(grid.firstChild);
        document.getElementById("status").textContent = `${visible.length} of ${items.length} searchable brush glyphs`;
        for (const item of visible) {
        const figure = document.createElement("figure");
        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.setAttribute("role", "img");
        glyph.setAttribute("aria-label", item.name);
        glyph.textContent = String.fromCodePoint(...item.codepoints);
        const caption = document.createElement("figcaption");
        caption.textContent = item.label ? `${item.label} · ${item.name}` : item.name;
        figure.append(glyph, caption);
        grid.append(figure);
        }
      };
      group.addEventListener("change", render);
      search.addEventListener("input", render);
      render();
    }).catch(error => {
      console.error("Emojinq gallery failed to initialize", error);
      document.getElementById("status").textContent = `Gallery failed to load: ${error.message || error}`;
    });
  </script>
</main></body>
</html>
