<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-6 -6 84 84" role="img" aria-label="Smiling face animated" data-emoji-animation="face-v1" data-animation="smile"><image href="../../color-all/1F604.svg" xlink:href="../../color-all/1F604.svg" x="-6" y="-6" width="84" height="84"/><g class="breathe"><style>@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 3.2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.breathe{animation:none}}</style></g></svg>
