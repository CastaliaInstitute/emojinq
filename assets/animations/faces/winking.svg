<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-6 -6 84 84" role="img" aria-labelledby="title desc" data-emoji-animation="face-v1" data-animation="wink">
  <title id="title">Winking face</title><desc id="desc">A face with a gently repeated wink.</desc>
  <image href="../../color-all/1F609.svg" xlink:href="../../color-all/1F609.svg" x="-6" y="-6" width="84" height="84"/>
  <path d="M42 30 Q46 27 50 30" fill="none" stroke="#262421" stroke-width="1.25" stroke-linecap="round" class="wink"/>
  <style>
    .wink { transform-box:fill-box; transform-origin:center; animation:face-wink 4.5s ease-in-out infinite; }
    @keyframes face-wink { 0%,72%,100% { transform:scaleY(0); } 76%,84% { transform:scaleY(1); } }
    @media (prefers-reduced-motion:reduce) { .wink { animation:none; } }
  </style>
</svg>
