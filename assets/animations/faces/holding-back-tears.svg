<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-6 -6 84 84" role="img" aria-label="Face holding back tears animated" data-emoji-animation="face-v1" data-animation="tear-drip"><image href="../../color-all/1F979.svg" xlink:href="../../color-all/1F979.svg" x="-6" y="-6" width="84" height="84"/><g fill="#4d8da8"><ellipse cx="25" cy="45" rx="1.2" ry="1.8" class="tear tear-left"/><ellipse cx="47" cy="45" rx="1.2" ry="1.8" class="tear tear-right"/></g><style>@keyframes tear-drip{0%,48%,100%{opacity:0;transform:translateY(0) scaleY(.7)}54%{opacity:.85;transform:translateY(1px) scaleY(1)}82%{opacity:.8;transform:translateY(8px) scaleY(1.25)}90%{opacity:0;transform:translateY(12px) scaleY(1.45)}}.tear{transform-box:fill-box;transform-origin:center;animation:tear-drip 3.8s ease-in infinite}.tear-right{animation-delay:.18s}@media(prefers-reduced-motion:reduce){.tear{animation:none;opacity:.35}}</style></svg>
