<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 84 84" role="img" aria-labelledby="title desc" data-emoji-animation="face-v1" data-animation="look-around">
  <title id="title">Face looking around</title><desc id="desc">A curious face whose pupils glance from side to side.</desc>
  <image href="../../color-all/1F610.svg" x="-6" y="-6" width="84" height="84"/>
  <g fill="#262421"><ellipse cx="27" cy="31" rx="1.6" ry="2.2" class="pupil-left"/><ellipse cx="45" cy="31" rx="1.6" ry="2.2" class="pupil-right"/></g>
  <style>
    .pupil-left,.pupil-right { animation:face-look 3.8s ease-in-out infinite; }
    .pupil-right { animation-delay:.03s; }
    @keyframes face-look { 0%,18% { transform:translateX(0); } 34%,48% { transform:translateX(-2.4px); } 64%,78% { transform:translateX(2.4px); } 94%,100% { transform:translateX(0); } }
    @media (prefers-reduced-motion:reduce) { .pupil-left,.pupil-right { animation:none; } }
  </style>
</svg>
