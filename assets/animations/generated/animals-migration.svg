<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 84 84" role="img" aria-label="Animals Migration animated" data-emoji-animation="stride-v1"><title>Animals Migration animated</title><image href="../../pua/animals/migration.svg" x="-6" y="-6" width="84" height="84"/><style>@keyframes m{0%,100%{transform:translate(0,0) rotate(-1deg)}25%{transform:translate(1px,-1px) rotate(1deg)}50%{transform:translate(2px,0) rotate(-1deg)}75%{transform:translate(1px,-1px) rotate(1deg)}}svg{transform-origin:center;animation:m 3.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){svg{animation:none}}</style></svg>
