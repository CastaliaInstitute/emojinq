<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-6 -6 84 84" role="img" aria-label="Sea_Creatures Octopus animated" data-emoji-animation="swim-v1"><title>Sea_Creatures Octopus animated</title><g class="body"><image href="../../pua/sea_creatures/octopus.svg" xlink:href="../../pua/sea_creatures/octopus.svg" x="-6" y="-6" width="84" height="84"/></g><path class="tail" d="M55 38q7-5 10 0q-7 5-10 0" fill="none" stroke="#4a4943" stroke-width="1"/><style>@keyframes m{0%,100%{transform:translateX(-1px) rotate(-1deg)}50%{transform:translateX(2px) rotate(1deg)}}.body{transform-origin:center;animation:m 3.8s ease-in-out infinite}.limbs,.wings,.tail,.vibrate{transform-box:fill-box;transform-origin:center;animation:m 3.8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.body,.limbs,.wings,.tail,.vibrate{animation:none}}</style></svg>
